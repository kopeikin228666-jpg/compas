    <div class="side-bottom"><div class="mini"><span class="side-dot"></span> ТВОЙ ТЕМП</div><p>Не нужно становиться другим человеком. Начнём с того, чтобы лучше услышать себя.</p></div>
  </aside>
  <main class="main"><div class="mobile-top"><div class="brand"><div class="brand-emblem">⌁</div><div><div class="brand-name">КОМПАС</div><div class="brand-caption">ЛИЧНЫЙ МАРШРУТ</div></div></div><span class="datebadge" id="mobileDate"></span></div><div id="content"></div><div class="bottom-note">Твой темп имеет значение. Эта программа помогает организовать повседневные действия, но не заменяет медицинскую или психологическую помощь.</div></main>

(function(){'use strict';
const ICONS={today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="m8 12 3 3 5-6"/></svg>',route:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M8 18h6a4 4 0 0 0 4-4v-6"/><path d="m15 9 3-3 3 3"/></svg>',notes:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>',gpt:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 9.2 9.2 3 12l6.2 2.8L12 21l2.8-6.2L21 12l-6.2-2.8z"/></svg>'};
const P=[
['Опора','Начать без рывка','Сегодня не нужно менять всю жизнь. Сделай одно небольшое действие, которое даст дню форму.','Убери одну небольшую поверхность или приготовь себе спокойное место на 5 минут.','Выбери одно простое занятие на 10 минут и попробуй его без оценки результата.','Напиши человеку, рядом с которым не нужно притворяться. Можно просто поздороваться.','Что оказалось легче, чем я ожидал?'],
['Опора','Замечать свои выборы','Даже небольшой собственный выбор важен, когда всё кажется автоматическим.','В начале дня реши сам, какую музыку или тишину выбрать.','Сделай одну бытовую вещь в выбранном тобой порядке, не спеша.','Если хочешь, расскажи кому-то одну честную мелочь о своём дне.','Какой выбор сегодня был именно моим?'],
['Опора','Не требовать радости','Не нужно проверять, счастлив ли ты. Сегодня достаточно просто присутствовать.','Проведи 5 минут у окна или на свежем воздухе, замечая обстановку.','Займись чем-нибудь нейтральным: приготовь еду, почитай или порисуй 10 минут.','Выбери компанию или спокойное одиночество сознательно, без чувства вины.','Где мне сегодня было спокойно или чуть менее тяжело?'],
['Опора','Вернуть ощущение ритма','Предсказуемость иногда важнее мотивации.','Определи ориентировочное время одного приёма пищи или отдыха.','Выбери короткое дело и закончи его в комфортном темпе.','Отправь близкому человеку сообщение без обязательства долго общаться.','Какой простой ритуал мне помог?'],

const K='kompas_mental_route_v1'; const today=()=>{let d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
const initial=()=>({version:1,started:today(),step:0,entries:{},plans:{}});
let storageOK=true;let state;
try{state=JSON.parse(localStorage.getItem(K)||'null')||initial()}catch(e){storageOK=false;state=initial()}
if(!state||typeof state!=='object'||!state.entries||!state.plans){state=initial()}
state.step=Math.min(29,Math.max(0,Number(state.step)||0));let view='today',chosenStep=state.step,selectedMonth=new Date(),toastTimeout;
function save(){try{localStorage.setItem(K,JSON.stringify(state));storageOK=true}catch(e){storageOK=false} const el=document.getElementById('saveStatus');if(el)el.textContent=storageOK?'● Сохранено на устройстве':'⚠ Сделай резервную копию'}
function E(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function prettyDate(d){return new Date(d+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})}
function shortDate(d){return new Date(d+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'short'})}
function monthName(d){return d.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}
function entry(date=today()){if(!state.entries[date])state.entries[date]={mood:'',energy:'',notes:['','',''],tasks:{},custom:[]};return state.entries[date]}
function moodName(v){return {'пусто':'Пусто','тревожно':'Тревожно','устало':'Усталость','ровно':'Ровно','легче':'Чуть легче'}[v]||'Не выбрано'}
function taskKey(step,i){return 'p'+step+'-'+i}
function countDone(step=state.step){const x=entry();return [0,1,2].filter(i=>x.tasks[taskKey(step,i)]).length}
function toast(s){const el=document.getElementById('toast');el.textContent=s;el.classList.add('show');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>el.classList.remove('show'),2400)}
const tabs=[['today','Сегодня'],['route','Маршрут'],['notes','Дневник'],['gpt','План от GPT']];
function renderNav(){for(const id of ['navDesktop','navMobile']){document.getElementById(id).innerHTML=tabs.map(([t,label])=>`<button class="${view===t?'active':''}" data-view="${t}" aria-current="${view===t?'page':'false'}">${ICONS[t]}<span>${label}</span></button>`).join('')}}
function cardTask(idx,text,kicker,done,extra=''){return `<div class="task ${done?'isdone':''}" role="checkbox" tabindex="0" aria-checked="${!!done}" data-task="${E(idx)}"><span class="tick">✓</span><div class="taskinner"><div class="kicker">${E(kicker)}</div><div class="tasktext">${E(text)}</div></div>${extra}</div>`}
function standardTasks(){const p=P[state.step],e=entry(),daysPlans=state.plans[today()]||[];let html=''; for(let i=0;i<3;i++)html+=cardTask(taskKey(state.step,i),p[3+i],['01 · Опора','02 · Маленький эксперимент','03 · Контакт с миром'][i],!!e.tasks[taskKey(state.step,i)]); e.custom.forEach(t=>html+=cardTask('custom:'+t.id,t.text,'Твой пункт',!!t.done,'<button class="del-task" data-remove="'+E(t.id)+'" title="Удалить задачу" aria-label="Удалить задачу">×</button>'));daysPlans.forEach((t,i)=>html+=cardTask('gpt:'+i,t,'Добавлено из ChatGPT',!!e.tasks['gpt:'+i]));return html}
function renderToday(){let p=P[state.step],e=entry(),completed=countDone();return `<div class="topline"><div class="eyebrow">Здесь и сейчас · твой личный маршрут</div><span class="datebadge">${prettyDate(today())}</span></div>

<div class="section dash-grid"><div class="card"><div class="cardhead"><h3>Твой сегодняшний маршрут</h3><span class="pill green">Шаг ${state.step+1} / 30</span></div><div class="mainstep"><div class="stepnum">${String(state.step+1).padStart(2,'0')}</div><div><div class="steptitle">${E(p[1])}</div><div class="stepdesc">${E(p[2])}</div></div></div><div class="progress-track"><div style="width:${(state.step+1)/30*100}%"></div></div><div class="stepbottom"><span class="tiny">${E(p[0])} · Выбирай свой темп</span><button class="btn ghost small" data-view="route">Все 30 шагов ↗</button></div><p class="quote">«Не нужно становиться счастливым по расписанию. Достаточно немного узнать себя»</p></div>
<div class="card"><div class="cardhead"><h3>Как ты сегодня?</h3><span class="pill">Без оценки</span></div><p class="softnote">Отметь один раз, как есть. Не нужно ловить или проверять каждое ощущение.</p><div class="energy-options mood-options" id="moods">${['пусто','тревожно','устало','ровно','легче'].map(v=>`<button class="mood" data-mood="${v}" aria-pressed="${e.mood===v}">${moodName(v)}</button>`).join('')}</div><div class="divider"></div><div class="secondary-h">Сколько сегодня сил?</div><div class="energy-options">${[['1','Мало'],['2','Средне'],['3','Есть силы']].map(([v,n])=>`<button class="mood" data-energy="${v}" aria-pressed="${e.energy===v}">${n}</button>`).join('')}</div><div class="softnote" id="saveStatus">${storageOK?'● Сохранено на устройстве':'⚠ Сделай резервную копию'}</div></div></div>
<div class="section dash-grid"><div><div class="section-h"><div><h2>Три небольших шага</h2><div class="section-lead">Можно сделать один. Можно не успеть ничего. Это не провал.</div></div><span class="pill green">${completed} из 3</span></div><div class="plan-list" id="taskList">${standardTasks()}</div><div class="addrow"><input id="customTaskInput" maxlength="180" placeholder="Добавить свой маленький шаг…" aria-label="Свой шаг" /><button class="btn" data-action="addtask">Добавить</button></div><div class="btnrow"><button class="btn primary" data-action="nextstep">${state.step===29?'Маршрут завершён':'Перейти к следующему шагу →'}</button><button class="btn secondary" data-view="gpt">План лично от GPT ✦</button></div></div>
<div class="side-info"><div class="card"><h3>Вечерние 3 минуты</h3><p class="softnote">Ответы нужны не для самокритики, а чтобы замечать свои решения и более спокойные моменты.</p><div class="checkin-fields" style="margin-top:17px">${['Когда сегодня было хоть немного спокойнее?','Что я сегодня выбрал сам?','Что хочу попробовать завтра?'].map((q,i)=>`<div><label class="fieldlabel" for="note${i}">${q}</label><textarea id="note${i}" data-note="${i}" placeholder="Можно написать одно предложение…">${E(e.notes[i]||'')}</textarea></div>`).join('')}</div><div class="btnrow"><button class="btn primary" data-action="savenotes">Сохранить записи</button><button class="btn ghost" data-view="notes">Открыть дневник</button></div></div><div class="emergency"><div class="small-h">Небольшая опора</div><strong>Если накрывает тревога</strong><div style="margin-top:7px">Остановись в безопасном месте. Почувствуй опору под ногами, посмотри вокруг и назови, где ты находишься. Не требуй, чтобы ощущение сразу исчезло.</div></div></div></div>`}
function renderRoute(){let step=P[chosenStep];const phases=[['1–7','Опора','Небольшой ритм и немного устойчивости.'],['8–14','Интерес','Безопасные пробы без требования радости.'],['15–21','Связь','Контакт, границы и собственный темп.'],['22–30','Направление','Ценности и маленькие реальные решения.']];return `<div class="topline"><div><div class="eyebrow">ПРОГРАММА НА 30 ШАГОВ</div><h1 style="margin:10px 0 0;font-size:32px;letter-spacing:-1px">Карта возвращения к себе</h1></div><span class="datebadge">В собственном темпе</span></div><div class="card"><h3>Четыре этапа</h3><p class="softnote">Это не клиническое лечение и не марафон с дедлайнами. Здесь нет штрафов за пропущенный день. Переключай шаги, когда готов.</p><div class="phasegrid">${phases.map(([range,title,desc])=>`<div class="phase"><div class="phasekey">ШАГИ ${range}</div><h3>${title}</h3><p>${desc}</p></div>`).join('')}</div><div class="section-h"><div><h2>Выбери шаг</h2><div class="section-lead">Любой день можно пересмотреть</div></div><span class="pill green">Сейчас: ${state.step+1}</span></div><div class="stepgrid">${P.map((p,i)=>`<button data-step="${i}" class="stepbtn ${chosenStep===i?'chosen':''} ${i<state.step?'past':''}"><div class="steptop"><span>ШАГ ${String(i+1).padStart(2,'0')}</span><span>${i===state.step?'◉':''}</span></div><div class="steptopic">${E(p[1])}</div></button>`).join('')}</div><div class="step-details" id="stepDetails"><div class="eyebrow" style="margin-top:20px">${E(step[0])} · Шаг ${chosenStep+1}</div><h2>${E(step[1])}</h2><p>${E(step[2])}</p><div class="step-detail-list">${[3,4,5].map((i,j)=>`<div class="detailitem"><b>${['Опора','Эксперимент','Контакт'][j]}</b>${E(step[i])}</div>`).join('')}<div class="detailitem"><b>Вечерний вопрос</b>${E(step[6])}</div></div><div class="step-tools"><button class="btn primary" data-action="selectstep" ${chosenStep===state.step?'disabled':''}>${chosenStep===state.step?'Это твой текущий шаг':'Сделать текущим шагом →'}</button><button class="btn secondary" data-view="today">К сегодняшнему плану</button></div></div></div>`}
function renderNotes(){const now=new Date(selectedMonth.getFullYear(),selectedMonth.getMonth(),1),last=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();const offset=(now.getDay()+6)%7;let cells='';['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].forEach(n=>cells+=`<div class="weeklabel">${n}</div>`);for(let k=0;k<offset;k++)cells+='<div class="callday empty"></div>';for(let i=1;i<=last;i++){const key=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`,d=state.entries[key],has=d&&(d.mood||d.energy||(d.notes||[]).some(Boolean)||Object.values(d.tasks||{}).some(Boolean));cells+=`<div class="callday ${has?'haslog':''} ${key===today()?'today':''}" title="${E(key)}"><span>${i}</span>${has?'<span style="font-size:12px;color:var(--mint)">•</span>':''}</div>`}const logs=Object.entries(state.entries).filter(([day,x])=>x.mood||x.energy||(x.notes||[]).some(Boolean)||Object.values(x.tasks||{}).some(Boolean)).sort((a,b)=>b[0].localeCompare(a[0]));return `<div class="topline"><div><div class="eyebrow">ИСТОРИЯ, А НЕ РЕЙТИНГ</div><h1 style="margin:10px 0 0;font-size:32px;letter-spacing:-1px">Твой дневник</h1></div><span class="datebadge">Все записи остаются у тебя</span></div><div class="journalgrid"><div class="card"><div class="cardhead"><h3>Записи по дням</h3><span class="pill">${logs.length} дней с отметками</span></div>${logs.length?logs.map(([day,x])=>`<div class="journalentry"><div class="meta"><strong>${E(prettyDate(day))}</strong><span>${E(moodName(x.mood))} ${x.energy?'· Силы: '+x.energy+'/3':''}</span></div>${(x.notes||[]).some(Boolean)?(x.notes||[]).map((n,i)=>n?`<div class="detail"><span style="color:var(--muted)">${['Спокойнее:','Мой выбор:','Завтра:'][i]}</span> ${E(n)}</div>`:'').join(''):'<div class="detail muted">Только отметка состояния. И это тоже запись.</div>'}</div>`).join(''):'<p class="softnote">Здесь появятся твои записи. Начать можно с одной фразы сегодня.</p>'}<div class="btnrow"><button class="btn secondary" data-view="today">Заполнить сегодня →</button></div></div><div class="side-info"><div class="card"><div class="cardhead"><h3>${E(monthName(now))}</h3><div><button class="btn small ghost" data-action="prevmonth">‹</button><button class="btn small ghost" data-action="nextmonth">›</button></div></div><div class="calendargrid">${cells}</div><div class="softnote">Точки показывают дни с записями. Пустые клетки не означают ничего плохого.</div></div><div class="card"><h3>Небольшая сводка</h3>${renderStats()}<div class="softnote">Это только твои отметки, а не медицинская оценка состояния.</div></div><div class="card"><h3>Твои данные</h3><p class="softnote">Записи сохраняются в браузере на этом устройстве. Иногда делай резервную копию: очистка данных браузера может стереть дневник.</p><div class="btnrow"><button class="btn secondary" data-action="export">Скачать копию .json</button><button class="btn secondary" data-action="import">Восстановить</button></div></div></div></div>`}
function renderStats(){let data=Object.entries(state.entries).filter(([d,x])=>x.mood||x.energy||(x.notes||[]).some(Boolean)),last=data.filter(([d])=>{const t=new Date(d+'T12:00:00');const n=new Date();return (n-t)/(24*3600*1000)<=7});let choices=data.reduce((n,[d,x])=>n+((x.notes||[])[1]?.trim()?1:0),0);return `<div class="ministats" style="margin:18px 0 15px"><div class="statbox"><div class="value">${data.length}</div><div class="caption">дней с записями</div></div><div class="statbox"><div class="value">${last.length}</div><div class="caption">за неделю</div></div><div class="statbox"><div class="value">${choices}</div><div class="caption">замеченных выборов</div></div></div>`}
function contextPrompt(){const cutoff=new Date();cutoff.setDate(cutoff.getDate()-7);let logs=Object.entries(state.entries).filter(([d,x])=>new Date(d+'T12:00:00')>=cutoff&&(x.mood||x.energy||(x.notes||[]).some(Boolean))).sort((a,b)=>a[0].localeCompare(b[0]));let summary=logs.map(([d,x])=>`${d}: состояние ${moodName(x.mood)}, силы ${x.energy||'не указаны'}/3. Спокойнее: ${x.notes?.[0]||'—'}. Мой выбор: ${x.notes?.[1]||'—'}. Хочу попробовать: ${x.notes?.[2]||'—'}.`).join('\n');return `Я веду дневник «Компас», чтобы возвращать интерес к повседневной жизни и учиться замечать собственные желания. У меня давно бывают ощущение жизни на автопилоте, эмоциональная отстранённость и тревога. Сейчас я выполняю шаг ${state.step+1}/30: «${P[state.step][1]}».\n\nМои отметки за последнюю неделю:\n${summary||'Записей пока мало.'}\n\nПомоги составить бережный психологический план на завтра: ровно 3 маленьких, конкретных и безопасных дела, без давления и без требования почувствовать счастье. Пусть это будут опора, маленький эксперимент для интереса и необязательный контакт с миром. Не ставь диагноз. Учитывай низкую энергию. Ответь ТОЛЬКО тремя отдельными строками, без номеров и вступления, чтобы я вставил их в приложение.`}
function renderGPT(){const prompt=contextPrompt(),custom=state.plans[today()]||[];return `<div class="topline"><div><div class="eyebrow">ТЫ + CHATGPT + ТВОИ РЕШЕНИЯ</div><h1 style="margin:10px 0 0;font-size:32px;letter-spacing:-1px">Личный план от GPT</h1></div><span class="datebadge">По твоим записям</span></div><section class="hero" style="min-height:160px"><span class="smallmark">✦ ИНДИВИДУАЛЬНО, НЕ АВТОМАТИЧЕСКИ</span><h1 style="font-size:27px;margin:12px 0 6px">Ты выбираешь темп.<br>Я помогаю собрать шаги.</h1><p>Приложение уже содержит 30 готовых шагов. А для нового персонального плана ты можешь передать мне краткую сводку своих отметок.</p></section><div class="section chat-layout"><div class="card"><h3>Как получить новый план</h3><div class="numbered"><div class="nrow"><span class="num">1</span><span>Нажми «Скопировать запрос». В нём будут только твои отметки за последнюю неделю и номер текущего шага.</span></div><div class="nrow"><span class="num">2</span><span>Вставь запрос в наш чат ChatGPT. Я предложу три маленьких действия с учётом твоего состояния.</span></div><div class="nrow"><span class="num">3</span><span>Скопируй три строки моего ответа в поле ниже и нажми «Добавить в сегодня».</span></div></div><div class="btnrow"><button class="btn primary" data-action="copyPrompt">Скопировать запрос ✦</button><a class="btn secondary" href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer" style="text-decoration:none">Открыть ChatGPT ↗</a></div><div class="divider"></div><div class="secondary-h">Пример запроса, который будет скопирован</div><div class="prompt" id="generatedPrompt">${E(prompt)}</div></div><div class="card"><h3>Вставить мой план</h3><p class="softnote">По одной короткой задаче на строку. Дополнительные пункты появятся на странице «Сегодня», рядом с готовым маршрутом.</p><textarea id="gptPlanText" placeholder="1. Пять минут спокойно разобрать стол\n2. Попробовать незнакомое занятие 10 минут\n3. Написать короткое сообщение знакомому"></textarea><div class="btnrow"><button class="btn primary" data-action="importPlan">Добавить в сегодня</button>${custom.length?'<button class="btn warn" data-action="clearPlan">Убрать старый план</button>':''}</div><div class="notice">${custom.length?'Сейчас добавлено '+custom.length+' пункта из ChatGPT. Можно заменить их новым планом.':'Добавленный план будет сохранён в этом браузере.'} Это приложение не подключается к чату автоматически. Ты сам решаешь, какие заметки отправить.</div></div></div>`}
function display(){renderNav();document.getElementById('mobileDate').textContent=shortDate(today());document.getElementById('content').innerHTML=({today:renderToday,route:renderRoute,notes:renderNotes,gpt:renderGPT}[view])();}
function nav(to){view=to; if(to==='route')chosenStep=state.step;display();window.scrollTo({top:0,behavior:'smooth'})}
function newStep(){if(state.step===29){toast('Ты прошёл все 30 шагов. Продолжай в собственном темпе.');return}state.step++;save();display();toast('Следующий шаг открыт. Без спешки.')}
function addTask(){const el=document.getElementById('customTaskInput');const v=el?.value.trim();if(!v)return toast('Напиши короткий шаг');if(v.length>180)return toast('Сократи текст');const e=entry();e.custom.push({id:String(Date.now())+Math.random().toString(36).slice(2,6),text:v,done:false});save();display();toast('Добавлено в план')}
function importPlan(){const text=document.getElementById('gptPlanText')?.value||'';const lines=text.split('\n').map(s=>s.replace(/^\s*(?:[-•*]|\d+[.)])\s*/, '').trim()).filter(Boolean).slice(0,5);if(!lines.length)return toast('Вставь хотя бы одну строку');state.plans[today()]=lines.map(s=>s.slice(0,240));const e=entry();Object.keys(e.tasks).filter(k=>k.startsWith('gpt:')).forEach(k=>delete e.tasks[k]);save();display();toast('План добавлен на сегодня')}
function doExport(){const data=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(data);const a=document.createElement('a');a.href=url;a.download='kompas-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);toast('Резервная копия готова')}
function copyText(text){if(navigator.clipboard?.writeText){return navigator.clipboard.writeText(text).then(()=>toast('Скопировано. Вставь в чат ChatGPT')).catch(()=>fallbackCopy(text))}return fallbackCopy(text)}
function fallbackCopy(text){const a=document.createElement('textarea');a.value=text;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Скопировано. Вставь в чат ChatGPT')}catch(e){toast('Выдели текст в запросе и скопируй вручную')}a.remove()}
document.addEventListener('click',ev=>{const n=ev.target.closest('[data-view]');if(n){nav(n.dataset.view);return}const m=ev.target.closest('[data-mood]');if(m){entry().mood=m.dataset.mood;save();display();return}const en=ev.target.closest('[data-energy]');if(en){entry().energy=en.dataset.energy;save();display();return}const rm=ev.target.closest('[data-remove]');if(rm){entry().custom=entry().custom.filter(t=>t.id!==rm.dataset.remove);save();display();return}const task=ev.target.closest('[data-task]');if(task){toggleTask(task.dataset.task);return}const step=ev.target.closest('[data-step]');if(step){chosenStep=Number(step.dataset.step);display();const el=document.getElementById('stepDetails');if(el&&window.innerWidth<860)el.scrollIntoView({behavior:'smooth',block:'start'});return}const a=ev.target.closest('[data-action]');if(!a)return;switch(a.dataset.action){case'addtask':addTask();break;case'nextstep':newStep();break;case'savenotes':save();toast('Записи сохранены');break;case'selectstep':state.step=chosenStep;save();nav('today');toast('Текущий шаг изменён');break;case'prevmonth':selectedMonth=new Date(selectedMonth.getFullYear(),selectedMonth.getMonth()-1,1);display();break;case'nextmonth':selectedMonth=new Date(selectedMonth.getFullYear(),selectedMonth.getMonth()+1,1);display();break;case'export':doExport();break;case'import':document.getElementById('restoreFile').click();break;case'copyPrompt':copyText(contextPrompt());break;case'importPlan':importPlan();break;case'clearPlan':delete state.plans[today()];save();display();toast('Дополнительный план убран');break;}});
function toggleTask(id){const e=entry();if(id.startsWith('custom:')){const item=e.custom.find(x=>x.id===id.slice(7));if(item)item.done=!item.done}else{e.tasks[id]=!e.tasks[id]}save();display()}
document.addEventListener('keydown',ev=>{const el=ev.target;if(el.matches('[data-task]')&&(ev.key==='Enter'||ev.key===' ')){ev.preventDefault();toggleTask(el.dataset.task)}if(el.id==='customTaskInput'&&ev.key==='Enter'){ev.preventDefault();addTask()}});
document.addEventListener('input',ev=>{const el=ev.target;if(el.dataset.note!==undefined){const index=Number(el.dataset.note);entry().notes[index]=el.value;save()}});
document.getElementById('restoreFile').addEventListener('change',async ev=>{const f=ev.target.files?.[0];if(!f)return;try{const o=JSON.parse(await f.text());if(!o||!o.entries||typeof o.entries!=='object'||!o.plans||!Array.isArray(P)||!Number.isInteger(Number(o.step)))throw Error('Неверный формат');if(!confirm('Заменить текущие записи данными из резервной копии?'))return;state={version:1,started:String(o.started||today()),step:Math.min(29,Math.max(0,Number(o.step))),entries:o.entries,plans:o.plans};save();display();toast('Данные восстановлены')}catch(e){toast('Файл не похож на резервную копию «Компас»')}finally{ev.target.value=''}});
save();display();
if(('serviceWorker' in navigator) && (location.protocol==='https:' || location.hostname==='localhost')) navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
